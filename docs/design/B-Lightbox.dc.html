<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warm Sketchbook, lightbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Nunito:wght@400;600;700&amp;family=Playpen+Sans:wght@400;500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#3B4054}
a{color:#2A2F45}a:hover{color:#2F6B5E}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #3B4054; font-family: {{body}}; color: #2A2F45; display: flex; align-items: center; justify-content: center; overflow: hidden">
<div role="dialog" aria-modal="true" aria-label="Animal Portrait (Full Body), enlarged" style="position: relative; width: 1040px; height: 660px; box-sizing: border-box; padding: 36px; border-radius: 28px; background: #FFFBF5; box-shadow: 0 30px 80px rgba(20, 22, 34, 0.35); display: flex; gap: 48px">

<button type="button" aria-label="Close" style="position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 0; background: #F5EEE3; color: #2A2F45; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg></button>

<div role="img" aria-label="Animal Portrait (Full Body) example, full uncropped image" style="flex-shrink: 0; width: 470px; height: 588px; border-radius: 20px; background: #DCE4D2; color: #4E5063; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
<span>Animal Portrait (Full Body) example</span>
<span style="font-weight: 400">Full image, uncropped</span>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-right: 20px">
<p style="margin: 0; align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: #DCE4D2; font-size: 13px; font-weight: 700">Pets</p>
<h2 style="margin: 0; font-family: {{display}}; font-weight: 600; font-size: 42px; line-height: 1.08">Animal Portrait (Full Body)</h2>
<p style="margin: 0; font-family: {{display}}; font-size: 28px; font-weight: 600; color: {{accent}}">$200+</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5E6072">[One-line description of this style]</p>
<a href="#etsy-animal-full-body" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">Commission this style<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg></a>
<p style="margin: 0; text-align: center; font-size: 13px; color: #5E6072">Opens the listing on Etsy</p>
<div style="margin-top: 28px; padding-top: 20px; border-top: 1.5px solid #EDE4D6; display: flex; align-items: center; justify-content: space-between">
<button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 10px; border-radius: 999px; border: 1.5px solid #DDD2C2; background: #FFFBF5; color: #2A2F45; font-weight: 700; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Previous</button>
<span style="font-size: 14px; font-weight: 600; color: #5E6072">5 of 12</span>
<button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px 0 16px; border-radius: 999px; border: 1.5px solid #DDD2C2; background: #FFFBF5; color: #2A2F45; font-weight: 700; font-size: 14px">Next<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6B5E","options":["#2F6B5E","#34568B","#6B4A7A","#A34E62"]},"fonts":{"editor":"enum","options":["Whimsical","Middle","Simple"],"default":"Middle"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var pairings = {
      Whimsical: { display: "'Playpen Sans', 'Nunito', sans-serif", body: "'Nunito', sans-serif" },
      Middle: { display: "'Fraunces', serif", body: "'Nunito', sans-serif" },
      Simple: { display: "'Figtree', sans-serif", body: "'Figtree', sans-serif" }
    };
    var type = pairings[this.props.fonts] || pairings.Middle;
    return { accent: this.props.accent ?? '#2F6B5E', display: type.display, body: type.body };
  }
}
</script>
</body>
</html>
